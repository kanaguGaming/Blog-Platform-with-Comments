<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">BLOGSPACE (Admin)</a>
        <nav id="navbar"></nav>
    </header>

    <div class="container">
        <h2>Admin Dashboard</h2>
        
        <div class="post-grid" style="margin-bottom: 2rem;">
            <div class="card" style="text-align: center;">
                <h3>Total Users</h3>
                <h2 id="totalUsers">0</h2>
            </div>
            <div class="card" style="text-align: center;">
                <h3>Total Posts</h3>
                <h2 id="totalPosts">0</h2>
            </div>
            <div class="card" style="text-align: center;">
                <h3>Total Comments</h3>
                <h2 id="totalComments">0</h2>
            </div>
        </div>

        <div class="card">
            <h3>User Management</h3>
            <div id="adminUsersContainer"></div>
        </div>

        <div class="card">
            <h3>Post Management</h3>
            <div id="adminPostsContainer"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
