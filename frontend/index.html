<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">BLOGSPACE</a>
        <nav id="navbar">
            <!-- Populated by JS -->
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Welcome to BlogSpace</h1>
            <p>Share your thoughts with everyone</p>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" class="form-control" placeholder="Search posts.....................">
            <button id="searchBtn" class="btn">Search</button>
        </div>
        
        <div style="margin-bottom: 1rem;">
            <label>Filter by Category: </label>
            <select id="categoryFilter" class="form-control" style="width:auto; display:inline-block;">
                <option value="">All Categories</option>
                <option value="Technology">Technology</option>
                <option value="Programming">Programming</option>
                <option value="Education">Education</option>
                <option value="Travel">Travel</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Gaming">Gaming</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <h2>Latest Posts</h2>
        <div id="postsContainer" class="post-grid">
            <!-- Posts will be loaded here -->
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/posts.js"></script>
</body>
</html>
